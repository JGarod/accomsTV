version: "3.8"

services:
  app:
    build: .
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=admin
      - DB_NAME=accoomztv
      - DB_PORT=3306
      - JWT_SECRET=q2Q0GqyNW|1\rJ:o}u0J2}L.+HIs.hR
      - PORT=3000
      - FFMPEG_PATH=/app/ffmpeg/bin/ffmpeg
    ports:
      - "3000:3000"     # 👈 Exponemos el backend web para ngrok
      - "1935:1935"     # 👈 RTMP para ngrok tcp
      - "8443:8443"     # 👈 RTMP para ngrok tcp
    volumes:
      - ../ffmpeg-7.1-full_build:/app/ffmpeg

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=accoomztv
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
